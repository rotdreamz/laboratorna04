{% extends 'base.html' %}
{% block content %}
<h1>Залишити відгук</h1>
<form method="post">
    <label>Ім'я
        <input type="text" name="name" required>
    </label>
    <label>Email
        <input type="email" name="email" required>
    </label>
    <label>Повідомлення
        <textarea name="message" rows="5" cols="40" required></textarea>
    </label>
    <button type="submit">Надіслати</button>
</form>
{% endblock %}
